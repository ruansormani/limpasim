<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo — Portal Reveal</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a0e14; color: #f4f4f4; }
  header { position: sticky; top: 0; height: 60px; display: flex; align-items: center;
    padding: 0 24px; background: #0a0e14ee; backdrop-filter: blur(8px); z-index: 10;
    border-bottom: 1px solid #ffffff1a; }
  .spacer { height: 100vh; display: grid; place-items: center; font-size: 1.4rem; opacity: .6; }
  .portal-media { background: linear-gradient(135deg, #1d4ed8, #7c3aed); }
  .portal-caption h2 { font-size: clamp(1.5rem, 4vw, 2.4rem); font-weight: 600; margin: 0; }
</style>
<link rel="stylesheet" href="portal-reveal.css">
</head>
<body>
  <header>--header-offset: 60px (altura deste header)</header>
  <div class="spacer">role pra baixo ↓</div>

  <section class="portal-track" style="--header-offset:60px">
    <div class="portal-stage">
      <div class="portal-media"><!-- troque por <video muted playsinline> ou <img> --></div>
      <div class="portal-caption"><h2>O card vira tela cheia enquanto você rola.</h2></div>
    </div>
  </section>

  <div class="spacer">depois do portal ↓</div>

  <script src="../../core/scroll-progress.js"></script>
  <script src="portal-reveal.js"></script>
</body>
</html>
